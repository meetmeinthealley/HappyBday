<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Why You're My Best Friend! 💖</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="./cause.css">
    <link rel="preload" as="audio" href="./assets/happy-birthday-song.mp3">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
       
    </style>
</head>
<body>
    <div class="container">
        <h1>Happy Birthday Meghu 💖</h1>

        <div class="memory-photo">
            <img src="./assets/clg1.jpeg" alt="Birthday memory">
        </div>

        <p class="subtitle">A little list of reasons why you're so special — click the button to shuffle them! 💕</p>

        <div id="reasons-container"></div>
        
        <button type="button" class="back-button" aria-label="Go back"><span class="back-arrow" aria-hidden="true">←</span> Go Back</button>
        <button class="shuffle-button">Click Here... 💕</button>
        <div class="reason-counter"></div>

        <div class="ending-section">
            <div class="teddy-hug">
                <img src="./d1.jpg" alt="Teddy Hug">
            </div>
            <div class="ending-text">You're the BESTEST ! 💖</div>
        </div>
    </div>

    <audio id="index-music" src="./assets/happy-birthday-song.mp3" preload="auto" autoplay loop style="display:none"></audio>

    <script src="cause.js">
       
    </script>
</body>
</html>
